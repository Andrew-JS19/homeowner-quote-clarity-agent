<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Homeowner Quote Clarity Agent architecture</title>
  <desc id="desc">Planned architecture. A private Cloud Run API will send a synthetic demo run to a Google ADK coordinator. Three specialized agents will use bounded deterministic tools and Gemini 3.5 Flash to produce a source-linked report. Cloud and model execution are not yet verified.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <style>
      .title { font: 700 48px Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #475569; }
      .card-title { font: 700 23px Arial, sans-serif; fill: #FFFFFF; }
      .card-body { font: 400 17px Arial, sans-serif; fill: #E2E8F0; }
      .light-title { font: 700 22px Arial, sans-serif; fill: #0F172A; }
      .light-body { font: 400 16px Arial, sans-serif; fill: #475569; }
      .pill { font: 700 15px Arial, sans-serif; fill: #334155; }
      .label { font: 700 15px Arial, sans-serif; fill: #475569; letter-spacing: 1.2px; }
      .arrow { fill: none; stroke: #64748B; stroke-width: 3; marker-end: url(#arrow); }
      .status { font: 700 16px Arial, sans-serif; fill: #92400E; letter-spacing: 0.7px; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1430" cy="80" r="160" fill="#C7D2FE" opacity="0.35"/>
  <circle cx="120" cy="820" r="210" fill="#99F6E4" opacity="0.25"/>

  <text x="90" y="90" class="title">Homeowner Quote Clarity Agent</text>
  <text x="90" y="130" class="subtitle">Evidence-first multi-agent workflow · synthetic data only · no contractor ranking</text>
  <rect x="1010" y="58" width="490" height="54" rx="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="1040" y="91" class="status">PLANNED · CLOUD + MODEL NOT YET VERIFIED</text>

  <text x="95" y="205" class="label">REQUEST + INFRASTRUCTURE</text>
  <g filter="url(#shadow)">
    <rect x="90" y="235" width="300" height="155" rx="24" fill="#FFFFFF"/>
    <circle cx="145" cy="292" r="27" fill="#DBEAFE"/>
    <path d="M135 292h20M145 282v20" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
    <text x="185" y="282" class="light-title">Judge / demo client</text>
    <text x="185" y="312" class="light-body">POST a bounded demo job</text>
    <text x="120" y="355" class="light-body">Waits for one bounded result</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="475" y="235" width="330" height="155" rx="24" fill="url(#cloud)"/>
    <text x="515" y="282" class="card-title">Private Google Cloud Run API</text>
    <text x="515" y="316" class="card-body">FastAPI · planned scale to zero</text>
    <text x="515" y="348" class="card-body">Bundled fixtures only · max 1 instance</text>
  </g>
  <path d="M390 312 H470" class="arrow"/>

  <text x="900" y="205" class="label">GOOGLE ADK ORCHESTRATION</text>
  <g filter="url(#shadow)">
    <rect x="890" y="235" width="610" height="155" rx="24" fill="url(#agent)"/>
    <text x="930" y="282" class="card-title">Gemini 3.5 Flash coordinator</text>
    <text x="930" y="316" class="card-body">Delegates three bounded tasks and summarizes validated facts</text>
    <rect x="930" y="338" width="160" height="30" rx="15" fill="#CCFBF1"/>
    <text x="954" y="359" class="pill">Google ADK 2.1</text>
    <rect x="1105" y="338" width="205" height="30" rx="15" fill="#CFFAFE"/>
    <text x="1125" y="359" class="pill">No external-action tools</text>
  </g>
  <path d="M805 312 H885" class="arrow"/>

  <text x="95" y="485" class="label">SPECIALIZED AGENTS</text>
  <g filter="url(#shadow)">
    <rect x="90" y="515" width="420" height="150" rx="22" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
    <rect x="90" y="515" width="12" height="150" rx="6" fill="#2563EB"/>
    <text x="130" y="562" class="light-title">1 · Manifest agent</text>
    <text x="130" y="596" class="light-body">Hashes every bundled fixture</text>
    <text x="130" y="625" class="light-body">Proves the input is fictional and local</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="590" y="515" width="420" height="150" rx="22" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2"/>
    <rect x="590" y="515" width="12" height="150" rx="6" fill="#0F766E"/>
    <text x="630" y="562" class="light-title">2 · Evidence agent</text>
    <text x="630" y="596" class="light-body">Builds the structured comparison</text>
    <text x="630" y="625" class="light-body">Preserves allowances, exclusions, unknowns</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1090" y="515" width="420" height="150" rx="22" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/>
    <rect x="1090" y="515" width="12" height="150" rx="6" fill="#7C3AED"/>
    <text x="1130" y="562" class="light-title">3 · Safety-review agent</text>
    <text x="1130" y="596" class="light-body">Checks anchors and injection quarantine</text>
    <text x="1130" y="625" class="light-body">Fails closed on any boundary violation</text>
  </g>
  <path d="M1120 390 C1010 445, 345 445, 300 510" class="arrow"/>
  <path d="M1190 390 C1100 450, 820 450, 800 510" class="arrow"/>
  <path d="M1260 390 C1320 440, 1300 465, 1300 510" class="arrow"/>

  <text x="95" y="745" class="label">DETERMINISTIC SOURCE OF TRUTH</text>
  <g filter="url(#shadow)">
    <rect x="90" y="775" width="1420" height="85" rx="22" fill="#0F172A"/>
    <text x="130" y="812" class="card-title">Source-linked report + ambiguity register + security events</text>
    <text x="130" y="841" class="card-body">Filename · line number · SHA-256 excerpt hash · confidence · human-review state · explicit no-ranking boundary</text>
  </g>
  <path d="M300 665 V770" class="arrow"/>
  <path d="M800 665 V770" class="arrow"/>
  <path d="M1300 665 V770" class="arrow"/>
</svg>
